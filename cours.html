function showNotification(msg, isErr = false) {
  const n = document.getElementById('notification');
  const t = document.getElementById('notificationMessage');
  t.textContent = msg;
  n.style.transform = 'translateX(0)';
  n.style.borderLeftColor = isErr ? '#dc2626' : '#00bcd4';
  clearTimeout(n._t);
  n._t = setTimeout(() => n.style.transform = 'translateX(400px)', 3000);
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]);
}
function darkenColor(hex, pct) {
  try {
    const n = parseInt(hex.replace('#', ''), 16);
    const amt = Math.round(2.55 * pct);
    const R = Math.max((n >> 16) - amt, 0);
    const G = Math.max((n >> 8 & 0x00FF) - amt, 0);
    const B = Math.max((n & 0x0000FF) - amt, 0);
    return `#${(1 << 24 | R << 16 | G << 8 | B).toString(16).slice(1)}`;
  } catch { return hex; }
}
function catInfo(cat) {
  return CATEGORIES[cat] || { label: cat || 'Général', color: '#64748b', icon: 'fa-book' };
}

async function loadSupabaseSDK() {
  if (window.supabase?.createClient) return true;
  return new Promise(r => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js';
    s.onload = () => r(true); s.onerror = () => r(false);
    document.head.appendChild(s);
  });
}

async function initSupabase() {
  if (!await loadSupabaseSDK()) { console.warn('SDK Supabase échoué'); return false; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
  });
  window.supabaseClient = sb;
  
  // ÉCOUTEUR DE SÉCURITÉ : si la session change ou expire, on met à jour l'interface
  sb.auth.onAuthStateChange((event, session) => {
    if (session?.user?.email === ADMIN_EMAIL) {
      currentUser = { uid: session.user.id, email: session.user.email, isAdmin: true };
      document.getElementById('adminBadge').classList.add('logged-in');

      currentUser = null;
      document.getElementById('adminBadge').classList.remove('logged-in');

      const panel = document.getElementById('adminPanel');
      if (panel?.classList.contains('active')) panel.classList.remove('active');
    }
  });
  
  console.log('✅ Supabase prêt');
  return true;
}

async function uploadPdf(file, folder = 'cours-pdfs') {
  if (!file) throw new Error('Aucun fichier');
  const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if (!isPdf) throw new Error('Seuls les PDF sont autorisés');
  if (file.size > 20 * 1024 * 1024) throw new Error('Fichier > 20 MB');

  const ts = Date.now();
  const rnd = Math.random().toString(36).substring(2, 8);
  const safe = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
  const path = `${folder}/${ts}_${rnd}_${safe}`;

  const { error } = await sb.storage.from(SUPABASE_BUCKET).upload(path, file, {
    cacheControl: '3600', upsert: false, contentType: 'application/pdf'
  });
  if (error) throw new Error('Upload: ' + error.message);

  const { data } = sb.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
  return { url: data.publicUrl, path, name: file.name };
}
async function deletePdf(path) {
  if (!path) return;
  try { await sb.storage.from(SUPABASE_BUCKET).remove([path]); } catch (e) {}
}

function persistSession() {
  if (!currentUser) return;
  localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify(currentUser));
}
function restoreSession() {
  try {
    const s = localStorage.getItem(ADMIN_SESSION_KEY);
    if (!s) return;
    const u = JSON.parse(s);
    if (u?.email === ADMIN_EMAIL) {
      currentUser = u;
      document.getElementById('adminBadge').classList.add('logged-in');
    }
  } catch {}
}

async function loginAdmin() {
  const email = document.getElementById('adminEmail')?.value?.trim();
  const pwd = document.getElementById('adminPassword')?.value?.trim();
  const errBox = document.getElementById('adminError');
  const errTxt = document.getElementById('errorText');
  const btn = document.querySelector('.login-btn');
  errBox?.classList.remove('show');

  if (!email || !pwd) { errBox?.classList.add('show'); if (errTxt) errTxt.textContent = 'Champs requis'; return; }
  if (email.toLowerCase() !== ADMIN_EMAIL) { errBox?.classList.add('show'); if (errTxt) errTxt.textContent = 'Accès refusé'; return; }

  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...'; }
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
    if (error) throw error;
    currentUser = { uid: data.user.id, email: data.user.email, isAdmin: true };
    persistSession();
    document.getElementById('adminBadge').classList.add('logged-in');
    showNotification('✅ Connexion réussie');
    renderAdminPanel();
  } catch (e) {
    errBox?.classList.add('show');
    if (errTxt) errTxt.textContent = e.message === 'Invalid login credentials' ? 'Email ou mot de passe incorrect' : e.message;
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Se connecter'; }
  }
}

async function logoutAdmin() {
  try { await sb.auth.signOut(); } catch {}
  currentUser = null;
  localStorage.removeItem(ADMIN_SESSION_KEY);
  document.getElementById('adminBadge').classList.remove('logged-in');
  document.getElementById('adminPanel').classList.remove('active');
  location.reload();
}

async function openAdminPanel() {
  if (!sb) return showNotification('Connexion en cours...', true);
  
  // Si pas connecté, on vérifie la session Supabase
  if (!currentUser) {
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session?.user?.email === ADMIN_EMAIL) {
        currentUser = { uid: session.user.id, email: session.user.email, isAdmin: true };
        persistSession();
      }
    } catch (e) {}
  }
  
  // Si toujours pas connecté, on affiche SEULEMENT le formulaire de login
  const p = document.getElementById('adminPanel');
  p.classList.toggle('active');
  if (p.classList.contains('active')) renderAdminPanel();
}

function switchTab(pane, btn) {

function openCoursForm(id) {
  if (!currentUser) return showNotification('Vous devez être connecté', true); // SÉCURITÉ
  const c = id ? coursData.find(x => x.id === id) : null;
  const catOpts = Object.entries(CATEGORIES).map(([k, v]) => `<option value="${k}" ${c?.categorie === k ? 'selected' : ''}>${v.label}</option>`).join('');
  const m = document.getElementById('dynamicModal') || (() => {
    const x = document.createElement('div'); x.id = 'dynamicModal'; x.className = 'modal';
    document.body.appendChild(x); return x;
  })();
  m.innerHTML = `<div class="modal-content small">
    <button class="close-modal" onclick="closeDynamicModal()">✕</button>
    <div class="modal-header" style="background:linear-gradient(135deg,#0a192f,#1a3a5f)">
      <h2>${id ? 'Modifier' : 'Nouveau'} cours</h2>
    </div>
    <div class="modal-body">
      <input type="hidden" id="coursId" value="${id || ''}">
      <input type="hidden" id="coursPdfUrl" value="${escapeHtml(c?.pdf_url || '')}">
      <input type="hidden" id="coursPdfName" value="${escapeHtml(c?.pdf_name || '')}">
      <input type="hidden" id="coursPdfPath" value="${escapeHtml(c?.pdf_path || '')}">
      <div class="form-group"><label>Titre *</label><input type="text" id="coursTitre" value="${escapeHtml(c?.titre || '')}" required></div>
      <div class="form-group"><label>Description</label><textarea id="coursDescription" rows="2">${escapeHtml(c?.description || '')}</textarea></div>
      <div class="form-group"><label>Catégorie *</label><select id="coursCategorie">${catOpts}</select></div>
      <div class="form-group"><label>Niveau</label><input type="text" id="coursNiveau" value="${escapeHtml(c?.niveau || '')}" placeholder="Débutant, Intermédiaire..."></div>
      <div class="form-group"><label>Durée</label><input type="text" id="coursDuree" value="${escapeHtml(c?.duree || '')}" placeholder="3 mois"></div>
      <div class="form-group"><label>Prérequis</label><input type="text" id="coursPrerequis" value="${escapeHtml(c?.prerequis || '')}"></div>
      <div class="form-group"><label>Objectifs</label><input type="text" id="coursObjectifs" value="${escapeHtml(c?.objectifs || '')}"></div>
      <div class="form-group"><label>Programme (1 module par ligne)</label><textarea id="coursProgramme" rows="4">${escapeHtml((c?.programme || []).join('\n'))}</textarea></div>
      <div class="form-group"><label>PDF du cours (optionnel)</label>
        <input type="file" id="coursPdfInput" accept="application/pdf">
        <div id="coursPdfStatus" style="margin-top:6px;font-size:.82rem;color:${c?.pdf_url ? '#10b981' : '#94a3b8'}">${c?.pdf_url ? '✅ PDF déjà présent' : 'Aucun PDF sélectionné'}</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" id="coursSubmitBtn" onclick="saveCours()"><i class="fas fa-save"></i> Enregistrer</button>
      <button class="btn-secondary" onclick="closeDynamicModal()">Annuler</button>
    </div>
  </div>`;
  m.classList.add('active');
  document.body.style.overflow = 'hidden';
  document.getElementById('coursPdfInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    const status = document.getElementById('coursPdfStatus');
    if (!file) return;
    status.textContent = '⏳ Upload en cours...';
    status.style.color = '#f59e0b';
    try {
      const r = await uploadPdf(file, 'cours-pdfs');
      document.getElementById('coursPdfUrl').value = r.url;
      document.getElementById('coursPdfName').value = r.name;
      document.getElementById('coursPdfPath').value = r.path;
      status.textContent = `✅ ${file.name} uploadé`;
      status.style.color = '#10b981';
    } catch (err) {
      status.textContent = '❌ ' + err.message;
      status.style.color = '#dc2626';
    }
  });
}
async function saveCours() {
  if (!currentUser) return showNotification('Vous devez être connecté', true); // SÉCURITÉ
  const id = document.getElementById('coursId').value;
  const titre = document.getElementById('coursTitre').value.trim();
  if (!titre) return showNotification('Titre requis', true);
  const data = {
    titre,
    description: document.getElementById('coursDescription').value.trim(),
    categorie: document.getElementById('coursCategorie').value,
    niveau: document.getElementById('coursNiveau').value.trim(),
    duree: document.getElementById('coursDuree').value.trim(),
    prerequis: document.getElementById('coursPrerequis').value.trim(),
    objectifs: document.getElementById('coursObjectifs').value.trim(),
    programme: document.getElementById('coursProgramme').value.split('\n').map(s => s.trim()).filter(Boolean),
    pdf_url: document.getElementById('coursPdfUrl').value,
    pdf_name: document.getElementById('coursPdfName').value,
    pdf_path: document.getElementById('coursPdfPath').value
  };
  const btn = document.getElementById('coursSubmitBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
  try {
    if (id) {
      const { error } = await sb.from('cours').update(data).eq('id', id);
      if (error) throw error;
    } else {
      const { error } = await sb.from('cours').insert(data);
      if (error) throw error;
    }
    showNotification('✅ Cours enregistré');
    closeDynamicModal();
    await loadCours();
    renderAll();
    renderAdminPanel();
  } catch (e) {
    showNotification('Erreur: ' + e.message, true);
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Enregistrer';
  }
}
async function deleteCours(id) {
  if (!currentUser) return showNotification('Vous devez être connecté', true); // SÉCURITÉ
  if (!confirm('Supprimer ce cours et son PDF ?')) return;
  const c = coursData.find(x => x.id === id);
  if (c?.pdf_path) await deletePdf(c.pdf_path);
  const { error } = await sb.from('cours').delete().eq('id', id);
  if (error) return showNotification('Erreur: ' + error.message, true);
  showNotification('Cours supprimé');
  await loadCours();
  renderAll();
  renderAdminPanel();
}

(async function boot() {
  AOS.init({ duration: 600, once: true });
  const mt = document.getElementById('menuToggle'), nm = document.getElementById('navMenu');
  mt?.addEventListener('click', e => { e.stopPropagation(); nm.classList.toggle('active'); });
  document.querySelectorAll('.nav-links a').forEach(a => a.addEventListener('click', () => nm.classList.remove('active')));
  document.addEventListener('click', e => { if (nm?.classList.contains('active') && !nm.contains(e.target) && !mt.contains(e.target)) nm.classList.remove('active'); });
  const btt = document.getElementById('backToTop');
  window.addEventListener('scroll', () => {
    btt?.classList.toggle('show', window.scrollY > 300);
    document.getElementById('navbar')?.classList.toggle('scrolled', window.scrollY > 50);
  });
  btt?.addEventListener('click', e => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeCoursModal(); closeBooksModal(); closePdfModal(); closeDynamicModal();
    }
  });
  const ok = await initSupabase();
  if (!ok) {
    document.getElementById('coursGrid').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><h3>Erreur de connexion</h3><p>Impossible de charger les cours.</p></div>';
    return;
  }
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user?.email === ADMIN_EMAIL) {
      currentUser = { uid: session.user.id, email: session.user.email, isAdmin: true };
      persistSession();
    }
  } catch {}
  restoreSession();
  await loadCours();
  await loadLivres();
  renderAll();
  setTimeout(() => document.getElementById('loader')?.classList.add('hidden'), 500);
})();
</script>
